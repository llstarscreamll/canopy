monorepo_root = true

# Product daily tasks live in apps/<product>/mise.toml.
# Habitat infra tasks live in infra/*/mise.toml.
# From anywhere:  mise //apps/atta:dev  |  mise //infra/landing-zone:up
# From apps/atta: mise :dev

[tools]
node = "24"
go = "1.25"
pnpm = "11.5"
turbo = "2.9"
air = "latest"
pulumi = "latest"

[monorepo]
config_roots = ["apps/*", "infra/*"]
